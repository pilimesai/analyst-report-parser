name: Update Volume Spike Stocks Daily

on:
  schedule:
    # 每個交易日台灣時間 20:05 (UTC 12:05) 自動執行
    # 改為 20:05 確保 yfinance 台股歷史量資料已完全更新（盤後 14:30 + 緩衝 5.5hr）
    - cron: '5 12 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance pandas requests

      - name: Fetch Volume Spike Stocks
        run: |
          python update_volume_spike.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add volume_spike.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update volume spike stocks"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit."
          fi

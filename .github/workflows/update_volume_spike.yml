name: Update Volume Spike Stocks Daily

on:
  schedule:
    # 每個交易日台灣時間 18:05 (UTC 10:05) 自動執行
    - cron: '5 10 * * 1-5'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance pandas requests

      - name: Fetch Volume Spike Stocks
        run: |
          python update_volume_spike.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add volume_spike.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update volume spike stocks" && git push)

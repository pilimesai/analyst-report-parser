name: Update Quant Results Daily

on:
  schedule:
    # 每天台灣時間 21:00 (UTC 13:00) 自動執行量化選股計算
    - cron: '0 13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-quant:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --prefer-binary requests pandas yfinance

      - name: Run Quant Engine Update
        run: |
          python update_quant.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add quant_results.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update quant stock selection results"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit."
          fi

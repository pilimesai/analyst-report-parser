name: Update Top Turnover Stocks Daily

on:
  schedule:
    # 每天台灣時間 20:00 (UTC 12:00) 自動執行 (盤後 + 緩衝)
    - cron: '0 12 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Top Turnover Stocks & Capitals
        run: |
          python update_top_turnover.py
          python update_stock_capital.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add top_turnover.json stock_capital.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update top turnover and stock capital"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit."
          fi

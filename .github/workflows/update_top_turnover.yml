name: Update Top Turnover Stocks Daily

on:
  schedule:
    # 每天台灣時間 20:00 (UTC 12:00) 自動執行 (盤後 + 緩衝)
    - cron: '0 12 * * 1-5'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Top Turnover Stocks
        run: |
          python update_top_turnover.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add top_turnover.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update top 30 stocks by turnover value" && git push)

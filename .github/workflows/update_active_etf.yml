name: Update Active ETF Holdings Daily

on:
  schedule:
    # 每天台灣時間 18:30 (UTC 10:30) 自動執行
    - cron: '30 10 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Active ETF Holdings
        run: |
          python update_active_etf.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add active_etf_holdings.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update active ETF holdings from Goal Star" && git push)

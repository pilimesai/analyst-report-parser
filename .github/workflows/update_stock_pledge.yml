name: Update Stock Pledge Tracker Daily

on:
  schedule:
    # 每個交易日台灣時間 16:40 (UTC 08:40) 自動執行
    - cron: '40 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Scan Major Shareholder Stock Pledges
        run: |
          python update_stock_pledge.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stock_pledge.json pledge_price_cache.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update stock pledge tracker"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit."
          fi

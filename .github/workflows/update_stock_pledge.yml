name: Update Stock Pledge Tracker Daily

on:
  schedule:
    # 每個交易日台灣時間 16:40 (UTC 08:40) 自動執行日常增量掃描 (包含每日重訊/申報即時捕捉)
    - cron: '40 8 * * 1-5'
    # 每週日台灣時間 18:00 (UTC 10:00) 自動執行全市場 1,800+ 檔深度巡檢 (方案 2)
    - cron: '0 10 * * 0'
  workflow_dispatch:
    inputs:
      full_scan:
        description: '執行全市場深度巡檢 (Full Market Deep Scan)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Scan Major Shareholder Stock Pledges
        run: |
          if [ "${{ github.event.inputs.full_scan }}" = "true" ] || [ "${{ github.event.schedule }}" = "0 10 * * 0" ]; then
            echo "Running Full Market Deep Scan (全市場深度巡檢)..."
            python update_stock_pledge.py --full-scan
          else
            echo "Running Daily Incremental Scan (日常增量掃描)..."
            python update_stock_pledge.py
          fi

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stock_pledge.json pledge_price_cache.json pledge_candidates_cache.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update stock pledge tracker"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit."
          fi

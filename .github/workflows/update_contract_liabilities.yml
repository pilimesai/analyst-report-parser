name: Update Contract Liabilities Stocks Daily

on:
  schedule:
    # 每個交易日台灣時間 16:30 (UTC 08:30) 自動執行
    - cron: '30 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scan Contract Liabilities Stocks
        env:
          FINMIND_API_TOKEN: ${{ secrets.FINMIND_API_TOKEN }}
        run: |
          python update_contract_liabilities.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add contract_liabilities.json contract_liabilities_cache.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update contract liabilities breakout stocks" && git push origin main)
